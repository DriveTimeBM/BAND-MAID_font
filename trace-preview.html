<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BAND-MAID font — trace preview</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; background: var(--bm-bg-page); color: var(--bm-text); font-family: var(--bm-font); }
  body { padding: 32px; font-size: var(--bm-fs-13); }
  h1 { font-size: var(--bm-fs-22); margin: 0 0 8px; font-weight: 600; }
  .lede { color: var(--bm-text-2); max-width: 70ch; margin: 0 0 32px; }
  .stats {
    display: inline-flex; gap: 18px; padding: 8px 14px;
    border: 1px solid var(--bm-border); border-radius: var(--bm-radius);
    background: var(--bm-bg); margin: 0 0 32px;
    font-family: var(--bm-font-mono); font-size: var(--bm-fs-11);
    color: var(--bm-text-2); font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--bm-accent); font-weight: 500; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px; background: var(--bm-border); border: 1px solid var(--bm-border);
  }
  .card { background: var(--bm-bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h3 {
    margin: 0; font-size: var(--bm-fs-10); letter-spacing: var(--bm-tracked);
    text-transform: uppercase; color: var(--bm-text-3);
    display: flex; justify-content: space-between; align-items: center;
  }
  .card h3 .name { color: var(--bm-accent); font-size: var(--bm-fs-12); letter-spacing: var(--bm-tracked-tight); }
  .panes {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 1px; background: var(--bm-border);
    border: 1px solid var(--bm-border);
  }
  .pane {
    background: #fff; aspect-ratio: 1 / 1;
    display: grid; place-items: center; padding: 12px;
    position: relative;
  }
  .pane.dark { background: #000; }
  .pane img, .pane svg {
    display: block; max-width: 100%; max-height: 100%; object-fit: contain;
  }
  .pane .badge {
    position: absolute; top: 4px; left: 4px;
    font-size: var(--bm-fs-9); letter-spacing: var(--bm-tracked-tight);
    color: var(--bm-text-3); background: rgba(0,0,0,0.6);
    padding: 2px 6px; border-radius: 2px;
    font-family: var(--bm-font-mono);
  }
  .pane:first-child .badge { color: #555; background: rgba(255,255,255,0.85); }
  .info {
    display: flex; gap: 16px; font-size: var(--bm-fs-10);
    font-family: var(--bm-font-mono); color: var(--bm-text-3);
    letter-spacing: var(--bm-tracked-tight); font-variant-numeric: tabular-nums;
  }
  .info b { color: var(--bm-text-2); font-weight: 500; }
</style>
</head>
<body>
  <h1>Trace preview · BAND-MAID font</h1>
  <p class="lede">
    Each card shows: <b>source PNG</b> · <b>traced polygon overlay</b> (red over the PNG, so any drift is visible) · <b>clean SVG render</b> (what will end up in the font). Tracing parameters: alpha&nbsp;threshold&nbsp;128, Ramer–Douglas–Peucker&nbsp;ε=1.5&nbsp;px.
  </p>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>

<script>
(async () => {
  const data = await fetch('traced-glyphs.json').then(r => r.json());
  const names = Object.keys(data);
  const totalVerts = names.reduce((s, n) => s + data[n].vertexCounts.reduce((a,b)=>a+b,0), 0);

  document.getElementById('stats').innerHTML =
    `<span><b>${names.length}</b> glyphs traced</span>` +
    `<span><b>${totalVerts}</b> total vertices</span>` +
    `<span>avg <b>${(totalVerts / names.length).toFixed(1)}</b> per glyph</span>`;

  const grid = document.getElementById('grid');
  for (const name of names) {
    const g = data[name];
    const card = document.createElement('div');
    card.className = 'card';
    const w = g.w, h = g.h;
    card.innerHTML = `
      <h3><span class="name">${name === 'HYPHEN' ? '-' : name}</span><span>${name}</span></h3>
      <div class="panes">
        <div class="pane">
          <span class="badge">SOURCE</span>
          <img src="glyphs-src/${name}.png" alt="${name}">
        </div>
        <div class="pane">
          <span class="badge">OVERLAY</span>
          <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
            <image href="glyphs-src/${name}.png" x="0" y="0" width="${w}" height="${h}" opacity="0.55"/>
            <path d="${g.d}" fill="none" stroke="#ef4444" stroke-width="${Math.max(1, w/200)}" fill-rule="evenodd"/>
            ${g.polys.flat().map(([x,y]) => `<circle cx="${x}" cy="${y}" r="${Math.max(1.5, w/200)}" fill="#ef4444"/>`).join('')}
          </svg>
        </div>
        <div class="pane dark">
          <span class="badge">RENDER</span>
          <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
            <path d="${g.d}" fill="#f0f0f0" fill-rule="evenodd"/>
          </svg>
        </div>
      </div>
      <div class="info">
        <span>img <b>${w}×${h}</b></span>
        <span>bbox <b>${g.bbox.w.toFixed(0)}×${g.bbox.h.toFixed(0)}</b></span>
        <span>polys <b>${g.polyCount}</b></span>
        <span>verts <b>${g.vertexCounts.join('+')}</b></span>
      </div>
    `;
    grid.appendChild(card);
  }
})();
</script>
</body>
</html>
